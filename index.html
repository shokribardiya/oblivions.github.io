<style>
  :root{
    --black:#050607;
    --panel:#0c0f11;
    --panel-2:#111518;
    --line:#232a2e;
    --line-soft:#1a2023;
    --ink:#eceeee;
    --ink-dim:#8a969b;
    --steel:#5c8fb5;
    --steel-2:#3f6a8a;
    --steel-glow:rgba(92,143,181,0.16);
  }
  *{margin:0;padding:0;box-sizing:border-box;}
  html{scroll-behavior:smooth;}
  body{background:var(--black);color:var(--ink);font-family:'Inter',sans-serif;overflow-x:hidden;}
  h1,h2,h3{font-family:'Space Grotesk',sans-serif;font-weight:600;letter-spacing:-0.01em;}
  .mono{font-family:'IBM Plex Mono',monospace;}
  a{color:inherit;text-decoration:none;}
  ::selection{background:var(--steel);color:#000;}
  @media (prefers-reduced-motion: reduce){*{animation:none !important;transition:none !important;}}
  img{display:block;max-width:100%;}

  /* NAV */
  nav{
    position:fixed;top:0;left:0;right:0;z-index:100;
    display:flex;align-items:center;justify-content:space-between;
    padding:18px 48px;
    background:linear-gradient(var(--black) 55%, transparent);
  }
  .brand{display:flex;align-items:center;gap:12px;font-size:15px;font-weight:700;letter-spacing:0.08em;}
  .brand img{width:30px;height:auto;}
  .navlinks{display:flex;gap:32px;font-size:13.5px;color:var(--ink-dim);}
  .navlinks a{transition:color .2s;}
  .navlinks a:hover{color:var(--ink);}
  .navcta{font-size:13px;border:1px solid var(--line);padding:9px 18px;color:var(--ink);white-space:nowrap;}
  .navcta:hover{border-color:var(--steel);}
  @media(max-width:960px){.navlinks{display:none;}nav{padding:16px 20px;}}

  /* START / HERO — team logo centerpiece */
  .start{
    position:relative;height:100vh;min-height:640px;
    display:flex;flex-direction:column;align-items:center;justify-content:center;
    text-align:center;background:var(--black);overflow:hidden;
  }
  .start-grid{
    position:absolute;inset:0;
    background-image:linear-gradient(var(--line-soft) 1px, transparent 1px),linear-gradient(90deg, var(--line-soft) 1px, transparent 1px);
    background-size:56px 56px;
    opacity:0.4;
    mask-image:radial-gradient(ellipse 65% 55% at 50% 45%, black 20%, transparent 75%);
  }
  .start-logo{
    position:relative;z-index:2;
    width:180px;height:auto;
    margin-bottom:28px;
    filter:drop-shadow(0 0 40px var(--steel-glow));
  }
  .start .eyebrow{
    position:relative;z-index:2;
    font-size:12.5px;color:var(--steel);letter-spacing:0.14em;
    display:flex;align-items:center;gap:10px;margin-bottom:18px;
  }
  .start .eyebrow::before,.start .eyebrow::after{content:'';width:20px;height:1px;background:var(--steel);}
  .start h1{
    position:relative;z-index:2;
    font-size:clamp(48px,9vw,108px);letter-spacing:0.02em;color:var(--ink);
  }
  .start p{
    position:relative;z-index:2;
    margin-top:18px;font-size:17px;color:var(--ink-dim);max-width:520px;line-height:1.6;
  }
  .start-actions{position:relative;z-index:2;margin-top:34px;display:flex;gap:16px;}
  .btn-primary{background:var(--ink);color:var(--black);padding:14px 26px;font-size:14px;font-weight:500;transition:background .2s;}
  .btn-primary:hover{background:var(--steel);}
  .btn-ghost{font-size:14px;color:var(--ink-dim);padding:14px 4px;border-bottom:1px solid var(--line);transition:color .2s,border-color .2s;}
  .btn-ghost:hover{color:var(--ink);border-color:var(--ink);}
  .scroll-cue{position:absolute;bottom:32px;left:50%;transform:translateX(-50%);z-index:2;font-size:11px;color:var(--ink-dim);letter-spacing:0.1em;display:flex;flex-direction:column;align-items:center;gap:10px;}
  .scroll-cue .bar{width:1px;height:30px;background:var(--line);position:relative;overflow:hidden;}
  .scroll-cue .bar::after{content:'';position:absolute;top:-100%;left:0;width:100%;height:100%;background:var(--steel);animation:cue 2.2s ease-in-out infinite;}
  @keyframes cue{0%{top:-100%;}50%{top:0;}100%{top:100%;}}

  /* BANNER — glass ribbon image */
  .banner{position:relative;height:56vh;min-height:340px;overflow:hidden;background:var(--black);}
  .banner img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;object-position:center;}
  .banner::before{content:'';position:absolute;inset:0;background:linear-gradient(180deg, var(--black) 0%, transparent 22%, transparent 78%, var(--black) 100%);z-index:1;}
  .banner-text{position:relative;z-index:2;height:100%;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;padding:0 24px;}
  .banner-text h2{font-size:clamp(24px,3.4vw,40px);max-width:760px;line-height:1.2;text-shadow:0 4px 30px rgba(0,0,0,0.6);}
  .banner-text p{margin-top:14px;color:var(--ink-dim);font-size:15px;max-width:520px;text-shadow:0 2px 16px rgba(0,0,0,0.7);}

  /* SECTION shell */
  section.block{position:relative;padding:110px 48px;}
  .section-head{display:grid;grid-template-columns:1fr 1fr;gap:60px;margin-bottom:60px;border-top:1px solid var(--line);padding-top:26px;}
  .section-head .tag{font-size:13px;color:var(--steel);margin-bottom:14px;}
  .section-head h2{font-size:clamp(26px,3.2vw,40px);line-height:1.15;}
  .section-head .desc{color:var(--ink-dim);font-size:15.5px;line-height:1.65;align-self:end;}
  @media(max-width:820px){.section-head{grid-template-columns:1fr;gap:18px;}section.block{padding:76px 22px;}}

  /* ARCHITECTURE MESH — ziggurat stack */
  .mesh{max-width:760px;margin:0 auto;display:flex;flex-direction:column;align-items:center;}
  .tier{width:100%;}
  .tier-card{
    background:var(--panel);border:1px solid var(--line);padding:30px 34px;
    transition:border-color .25s, transform .25s;
  }
  .tier-card:hover{border-color:var(--steel);transform:translateY(-3px);}
  .tier-label{font-size:12px;color:var(--ink-dim);margin-bottom:8px;display:flex;justify-content:space-between;}
  .tier-label b{color:var(--steel);font-weight:500;}
  .tier-card h3{font-size:19px;margin-bottom:8px;}
  .tier-card p{color:var(--ink-dim);font-size:14.5px;line-height:1.6;}
  .connector{display:flex;justify-content:center;padding:6px 0;}
  .connector svg{width:28px;height:16px;stroke:var(--steel);stroke-width:2;fill:none;opacity:0.8;}
  .tier-w1{max-width:100%;}
  .tier-w2{max-width:88%;margin:0 auto;}
  .tier-row{display:flex;gap:16px;max-width:88%;margin:0 auto;}
  .tier-row .tier-card{flex:1;}
  .tier-w3{max-width:64%;margin:0 auto;}
  .tier-w3 .tier-card{background:var(--panel-2);border-color:var(--steel-2);}
  @media(max-width:700px){.tier-row{flex-direction:column;}.tier-w2,.tier-row,.tier-w3{max-width:100%;}}

  /* METRICS */
  .metrics{background:var(--panel-2);border-top:1px solid var(--line);border-bottom:1px solid var(--line);}
  .metrics-grid{max-width:1180px;margin:0 auto;display:grid;grid-template-columns:repeat(4,1fr);}
  .metric{padding:42px 30px;border-left:1px solid var(--line);}
  .metric:first-child{border-left:none;}
  .metric .num{font-family:'Space Grotesk',sans-serif;font-size:40px;font-weight:700;color:var(--ink);}
  .metric .lbl{margin-top:8px;color:var(--ink-dim);font-size:13.5px;}
  @media(max-width:820px){.metrics-grid{grid-template-columns:1fr 1fr;}.metric{border-left:1px solid var(--line);border-top:1px solid var(--line);}.metric:nth-child(odd){border-left:none;}.metric:nth-child(-n+2){border-top:none;}}

  /* INDUSTRIES */
  .industries{max-width:1180px;margin:0 auto;display:grid;grid-template-columns:repeat(4,1fr);gap:1px;background:var(--line);}
  .industry{background:var(--black);padding:32px 28px;min-height:160px;display:flex;flex-direction:column;justify-content:space-between;transition:background .25s;}
  .industry:hover{background:var(--panel);}
  .industry .idx{font-family:'IBM Plex Mono',monospace;font-size:12px;color:var(--steel);}
  .industry h4{margin-top:auto;font-size:16.5px;font-weight:600;}
  @media(max-width:900px){.industries{grid-template-columns:1fr 1fr;}}
  @media(max-width:520px){.industries{grid-template-columns:1fr;}}

  /* IMPACT */
  .impact-list{max-width:1000px;margin:0 auto;display:flex;flex-direction:column;gap:1px;background:var(--line);}
  .impact-item{background:var(--black);padding:38px 40px;display:grid;grid-template-columns:140px 1fr;gap:32px;}
  .impact-item .stat{font-family:'Space Grotesk',sans-serif;font-size:30px;font-weight:700;color:var(--steel);}
  .impact-item .stat-lbl{margin-top:6px;font-size:12px;color:var(--ink-dim);}
  .impact-item h4{font-size:17px;margin-bottom:8px;}
  .impact-item p{color:var(--ink-dim);font-size:14.5px;line-height:1.6;}
  @media(max-width:640px){.impact-item{grid-template-columns:1fr;gap:14px;}}

  /* SECURITY */
  .security-grid{max-width:1180px;margin:0 auto;display:grid;grid-template-columns:repeat(3,1fr);gap:1px;background:var(--line);}
  .sec-card{background:var(--panel);padding:34px;}
  .sec-card h4{font-size:16.5px;margin-bottom:10px;}
  .sec-card p{color:var(--ink-dim);font-size:14px;line-height:1.6;}
  @media(max-width:820px){.security-grid{grid-template-columns:1fr;}}

  /* TEAM */
  .team-wrap{max-width:820px;margin:0 auto;display:grid;grid-template-columns:120px 1fr;gap:40px;align-items:center;border:1px solid var(--line);padding:44px;background:var(--panel);}
  .monogram{width:100%;aspect-ratio:1;border:1px solid var(--steel-2);display:flex;align-items:center;justify-content:center;font-family:'Space Grotesk',sans-serif;font-size:30px;color:var(--steel);}
  .team-wrap h3{font-size:22px;}
  .team-wrap .role{color:var(--steel);font-size:13px;margin:6px 0 14px;font-family:'IBM Plex Mono',monospace;}
  .team-wrap p{color:var(--ink-dim);font-size:15px;line-height:1.65;}
  @media(max-width:600px){.team-wrap{grid-template-columns:1fr;text-align:center;padding:30px;}.monogram{width:90px;margin:0 auto;}}

  /* CTA / CONTACT */
  .cta{text-align:center;padding:140px 24px;position:relative;}
  .cta::before{content:'';position:absolute;inset:0;background:radial-gradient(ellipse 60% 50% at 50% 40%, var(--steel-glow), transparent 70%);}
  .cta h2{position:relative;font-size:clamp(28px,4vw,48px);max-width:760px;margin:0 auto;line-height:1.15;}
  .cta p{position:relative;margin-top:18px;color:var(--ink-dim);font-size:15px;}
  .contact-links{position:relative;margin-top:30px;display:flex;gap:28px;justify-content:center;flex-wrap:wrap;font-size:14.5px;}
  .contact-links a{border-bottom:1px solid var(--line);padding-bottom:3px;transition:border-color .2s,color .2s;color:var(--ink-dim);}
  .contact-links a:hover{color:var(--ink);border-color:var(--steel);}
  .cta .btn-primary{position:relative;display:inline-block;margin-top:32px;}

  footer{border-top:1px solid var(--line);padding:48px;display:flex;justify-content:space-between;align-items:flex-start;color:var(--ink-dim);font-size:13px;flex-wrap:wrap;gap:28px;}
  footer .brand img{width:26px;}
  footer .fcol h5{color:var(--ink);font-size:13px;margin-bottom:12px;font-weight:600;}
  footer .fcol a{display:block;color:var(--ink-dim);margin-bottom:8px;transition:color .2s;}
  footer .fcol a:hover{color:var(--ink);}
  .fcols{display:flex;gap:56px;flex-wrap:wrap;}
  .copyright{width:100%;border-top:1px solid var(--line-soft);margin-top:8px;padding-top:20px;font-size:12px;color:var(--ink-dim);}

  :focus-visible{outline:2px solid var(--steel);outline-offset:2px;}
</style>
</head>
